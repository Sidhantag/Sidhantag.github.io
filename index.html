 Platform Automation Tools`,company:`FinIQ Consulting Pvt. Ltd.`,place:`Pune`,period:`Sep 2021 – Dec 2025`,headline:`Owned quality, security and observability end to end for a multi-asset trading platform (equities, derivatives, FX, bonds).`,points:[{tag:`Quality`,text:`Led end-to-end quality engineering for a platform serving 50+ financial institutions across APAC, EMEA and the Americas, working in Agile/Scrum with cross-functional squads.`},{tag:`Automation`,text:`Designed and maintained a Playwright/JavaScript and Selenium framework (1,200+ tests) across UI, API and integration layers; cut the regression cycle from 5 days to under 8 hours.`},{tag:`DevSecOps`,text:`Architected the DevSecOps pipeline: SAST (Fortify ScanCentral), SCA (Black Duck, Sonatype Nexus IQ) and DAST in Jenkins / Azure DevOps. Zero critical P0 security escapes for 3 consecutive release cycles.`},{tag:`Observability`,text:`Built the observability stack (Datadog, Splunk, OpenTelemetry) for Kafka-based trading pipelines; authored 40+ SLO/SLI dashboards and alert policies, reducing MTTR by ~35%.`},{tag:`Compliance`,text:`Drove ISO 27001 and PCI-DSS posture across test environments; led audit preparation and closed 18 nonconformances over two certification cycles.`},{tag:`Tooling`,text:`Engineered automated CVE triage and deduplication tooling in Python (O(n) logic) handling 10M+ records, improving remediation SLA compliance by 60%.`},{tag:`AI Quality`,text:`Designed an LLM evaluation and security research framework covering prompt injection, jailbreak vectors and model reliability.`},{tag:`Leadership`,text:`Mentored 6 SDETs and QA engineers; ran retrospectives and backlog grooming, improving team velocity by 20%.`},{tag:`Domain`,text:`Defined acceptance criteria across FIX Protocol, SWIFT messaging and structured product pricing modules to shift quality left.`}]},{title:`Application Consultant – QA Automation SME`,company:`FinIQ Consulting Pvt. Ltd.`,place:`Nashik`,period:`Jun 2017 – Aug 2021`,he
