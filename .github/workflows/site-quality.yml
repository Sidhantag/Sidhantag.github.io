name: Site quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * 1' # weekly, Monday 08:00 IST: catches links that break over time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Broken link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn blocks automated checks (HTTP 999); namespace URLs in the bundle are not real links.
          args: >-
            --no-progress
            --accept 200,204,206,429
            --exclude 'linkedin\.com'
            --exclude 'w3\.org'
            --exclude 'react\.dev/errors'
            index.html
          fail: true

  lighthouse:
    name: Lighthouse (performance, accessibility, SEO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
